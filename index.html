<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swift · Catálogo de compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2F0; --surface:#FFFFFF; --ink:#2A1415; --muted:#7A6564;
  --line:#EADFDC; --meat:#9B1C20; --wine:#5A1013; --meat-ink:#FFFFFF;
  --active:#FBEDEB; --ice:#2F6E8E; --ice-bg:#E6F1F6; --gold:#B88A3E; --gold-bg:#F6EEDD;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#170F0F; --surface:#231919; --ink:#F4ECEA; --muted:#B39C9A;
    --line:#3A2A2A; --meat:#D6403F; --wine:#2A0B0C; --active:#3A1E1E;
    --ice:#8CC6E2; --ice-bg:#1C2D36; --gold:#E2BC74; --gold-bg:#33291A;
  }
}
:root[data-theme="dark"]{
  --bg:#170F0F; --surface:#231919; --ink:#F4ECEA; --muted:#B39C9A;
  --line:#3A2A2A; --meat:#D6403F; --wine:#2A0B0C; --active:#3A1E1E;
  --ice:#8CC6E2; --ice-bg:#1C2D36; --gold:#E2BC74; --gold-bg:#33291A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:1rem; line-height:1.45}
.hero{position:relative; background:linear-gradient(160deg,#1b1616 0%,#2a1012 55%,var(--wine) 100%); color:#fff; overflow:hidden;
  padding:calc(2.2rem + env(safe-area-inset-top,0px)) 1.25rem 0}
.hero-inner{max-width:34rem; margin:0 auto; position:relative; z-index:1}
.logo{width:8.5rem; height:auto; display:block; border-radius:.6rem; box-shadow:0 6px 18px rgba(0,0,0,.35)}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:800;
  font-size:clamp(4.5rem,22vw,7rem); line-height:.85; letter-spacing:-.02em; margin:0}
.tagline{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600;
  font-size:1.45rem; line-height:1.15; margin:.6rem 0 0; color:#F3D9D6; max-width:16rem}
.badge{position:absolute; top:0; right:0; background:#fff; color:var(--wine);
  border-radius:50%; width:5.2rem; height:5.2rem; display:grid; place-items:center; text-align:center;
  font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:.95rem; line-height:1;
  transform:rotate(8deg)}
.photos{max-width:34rem; margin:1.5rem auto 0; display:grid; grid-template-columns:1.25fr 1fr; gap:.5rem}
.photos img{width:100%; height:9.5rem; object-fit:cover; display:block; border-radius:.9rem .9rem 0 0}
main{max-width:34rem; margin:0 auto; padding:1.75rem 1.25rem 9rem}
.intro{color:var(--muted); margin:0 0 1.25rem}
.tabs{display:none; gap:.5rem; margin:0 0 1.5rem} .tabs.show{display:flex}
.tabs button{flex:1; padding:.65rem; border-radius:.7rem; border:1.5px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-weight:600; cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--meat); color:var(--meat)}
.field{margin:0 0 1.5rem}
.field label{display:block; font-weight:600; margin-bottom:.35rem}
.field input{width:100%; padding:.8rem .95rem; font:inherit; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:.7rem}
.field input:focus-visible{outline:3px solid var(--meat); outline-offset:1px; border-color:var(--meat)}
#list{list-style:none; margin:0; padding:0; background:var(--surface); border-radius:1rem;
  border:1px solid var(--line); overflow:hidden}
#list li{display:flex; align-items:center; gap:.8rem; padding:.75rem .85rem; border-top:1px solid var(--line);
  transition:background-color .15s}
#list li:first-child{border-top:0}
#list li.on{background:var(--active)}
.ico{flex-shrink:0; width:2.6rem; height:2.6rem; border-radius:.7rem; background:var(--active);
  display:grid; place-items:center; color:var(--meat)}
#list li.on .ico{background:var(--meat); color:#fff}
.ico svg{width:1.7rem; height:1.7rem}
.info{flex:1; min-width:0}
.name{display:block; font-weight:600; font-size:1.05rem; line-height:1.2}
.meta{display:flex; align-items:center; flex-wrap:wrap; gap:.4rem; margin-top:.15rem}
.price{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:1.2rem; color:var(--meat);
  font-variant-numeric:tabular-nums}
.price small{font-family:"Barlow",sans-serif; font-weight:500; font-size:.8rem; color:var(--muted)}
.tag{font-size:.75rem; font-weight:600; padding:.1rem .45rem; border-radius:1rem}
.tag.caja{color:var(--muted); background:var(--active)}
.tag.cong{color:var(--ice); background:var(--ice-bg)}
.tag.black{color:var(--gold); background:var(--gold-bg)}
.stepper{display:flex; align-items:center; gap:.15rem; flex-shrink:0}
.stepper button{width:2.35rem; height:2.35rem; border-radius:50%; border:1.5px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:1.25rem; line-height:1; cursor:pointer; font-family:inherit}
.stepper button.plus{border-color:var(--meat); background:var(--meat); color:#fff}
.stepper button:disabled{opacity:.3; cursor:default}
.stepper button:focus-visible,.send:focus-visible,.tabs button:focus-visible{outline:3px solid var(--meat); outline-offset:2px}
.qty{width:2rem; text-align:center; font-weight:600; font-size:1.1rem; font-variant-numeric:tabular-nums}
.note{color:var(--muted); font-size:.9rem; margin:1rem .25rem 0}
.bar{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:.85rem 1.25rem calc(.85rem + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 20px rgba(60,10,10,.08)}
.bar-inner{max-width:34rem; margin:0 auto; display:flex; align-items:center; gap:1rem}
.total{flex:1; color:var(--muted); line-height:1.25}
.total strong{display:block; color:var(--ink); font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:1.6rem; line-height:1.05}
.send{border:0; border-radius:.8rem; padding:.9rem 1.35rem; background:var(--meat); color:var(--meat-ink);
  font-family:inherit; font-weight:600; font-size:1rem; cursor:pointer}
.send:disabled{opacity:.4; cursor:default}
.toast{position:fixed; left:50%; bottom:calc(6rem + env(safe-area-inset-bottom,0px)); transform:translate(-50%,.5rem);
  opacity:0; pointer-events:none; background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:.5rem;
  font-weight:500; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}
#ordersView{display:none}
.order{background:var(--surface); border:1px solid var(--line); border-radius:1rem; padding:1rem 1.1rem; margin-bottom:.8rem}
.order.done{opacity:.5}
.order-head{display:flex; justify-content:space-between; align-items:baseline; gap:1rem}
.order-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:1.5rem; font-weight:700}
.order-when{color:var(--muted); font-size:.9rem}
.order ul{list-style:none; margin:.4rem 0 .8rem; padding:0}
.order li{padding:.15rem 0}
.done-btn{padding:.5rem .9rem; border-radius:.6rem; border:1.5px solid var(--line); background:var(--surface);
  color:var(--ink); font:inherit; cursor:pointer}
.send.big{display:block; width:100%; margin-top:1.25rem; padding:1.05rem; font-size:1.1rem}
.status{font-size:.8rem; font-weight:600; padding:.15rem .55rem; border-radius:1rem; background:var(--active); color:var(--meat)}
.status.ok{background:var(--ice-bg); color:var(--ice)}
.order-total{color:var(--muted); margin:0 0 .8rem}
.empty{color:var(--muted)}
.sent{display:none; background:var(--surface); border:1px solid var(--line); border-radius:1rem; padding:1.5rem}
.sent h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:2rem; margin:0 0 .4rem; color:var(--meat)}
.sent p{margin:0}
.sent button{margin-top:1.1rem}

/* encabezado en una sola fila */
.hero{padding-top:1rem !important}
.hero-inner{display:flex; align-items:center; gap:.75rem}
.hero-inner .brand{margin:0; line-height:0; flex-shrink:0}
.hero-inner .logo{width:4.6rem; border-radius:.45rem}
.hero-inner .tagline{flex:1; min-width:0; margin:0; max-width:none; font-size:1.15rem; line-height:1.1}
.hero-inner .badge{order:3; position:static; flex-shrink:0; width:4.2rem; height:4.2rem; font-size:.8rem; transform:rotate(8deg)}
.photos{margin-top:1rem}
.photos img{height:6.5rem}
#list li{align-items:center}
.foto{flex-shrink:0; width:6.4rem; height:4.8rem; object-fit:cover; border-radius:.7rem; background:#fff; border:2px solid var(--line); display:block}
.fotobox{position:relative; flex-shrink:0; display:block}
.sello{width:1.15rem; height:1.15rem; object-fit:cover; border-radius:.2rem; vertical-align:-.15rem; margin-right:.35rem}
#list li.on .foto{border-color:var(--meat)}
.foto{cursor:zoom-in}
#zoom{position:fixed; inset:0; z-index:50; background:rgba(15,8,8,.78); display:flex; align-items:center; justify-content:center; padding:16px}
#zoom[hidden]{display:none!important}
.z-card{position:relative; width:100%; max-width:30rem; background:var(--surface); border-radius:1rem; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.4)}
.z-img{width:100%; max-height:62vh; object-fit:cover; display:block; background:#fff}
.z-body{padding:1rem 1.1rem 1.1rem; display:flex; flex-direction:column; gap:.4rem}
.z-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:1.6rem; line-height:1.1}
.z-tag:empty{display:none}
.z-price{font-size:1.5rem}
.z-row{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:.4rem}
.z-row .stepper button{width:2.8rem; height:2.8rem; font-size:1.4rem}
.z-row .qty{width:2.4rem; font-size:1.3rem}
.z-x{position:absolute; top:.5rem; right:.5rem; width:2.4rem; height:2.4rem; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:1.5rem; line-height:1; cursor:pointer}
.z-x:focus-visible,.z-ok:focus-visible{outline:3px solid var(--meat); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ #list li,.toast{transition:none} }
</style>
</head>

      <span class="name"><img class="sello" src="${SELLO}" alt="Swift Black">${cut}</span>
      <span class="meta"><span class="price" data-cut="${cut}">${money(p.price)}<small> x kg</small></span>
        <span class="tag caja">Caja x ${["Bife Ancho","Bife Angosto","Molleja"].includes(cut) ? 10 : 20} kg</span>
        ${p.cong ? '<span class="tag cong">Congelado</span>' : ''}
        ${black ? '<span class="tag black">Black</span>' : ''}</span>
    </span>
    <span class="stepper">
      <button class="minus" aria-label="Quitar una caja de ${cut}" disabled>−</button>
      <span class="qty" aria-live="polite">0</span>
      <button class="plus" aria-label="Agregar una caja de ${cut}">+</button>
    </span>`;
  const [minus, plus] = li.querySelectorAll("button");
  const out = li.querySelector(".qty");
  const update = d => {
    qty[cut] = Math.max(0, qty[cut] + d);
    out.textContent = qty[cut];
    minus.disabled = qty[cut] === 0;
    li.classList.toggle("on", qty[cut] > 0);
    refresh();
  };
  minus.onclick = () => update(-1);
  plus.onclick = () => update(1);
  CTL[cut] = update;
  const foto = li.querySelector(".foto");
  foto.setAttribute("role", "button"); foto.tabIndex = 0;
  foto.onclick = () => abrirZoom(p);
  foto.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirZoom(p); } };
  list.appendChild(li);
});

// Foto grande al tocar la imagen, con opción de pedir
function abrirZoom(p){
  const z = document.getElementById("zoom");
  z.querySelector(".z-img").src = PHOTOS[p.name];
  z.querySelector(".z-img").alt = p.name;
  z.querySelector(".z-name").textContent = p.name;
  z.querySelector(".z-price").innerHTML = `${money(p.price)}<small> x kg</small>`;
  z.querySelector(".z-tag").textContent = p.cong ? "Congelado" : "";
  z.dataset.cut = p.name;
  pintarZoom();
  z.hidden = false;
  z.querySelector(".z-plus").focus();
}
function pintarZoom(){
  const z = document.getElementById("zoom"), c = z.dataset.cut;
  z.querySelector(".z-qty").textContent = qty[c];
  z.querySelector(".z-minus").disabled = qty[c] === 0;
}
function cerrarZoom(){ document.getElementById("zoom").hidden = true; }
(() => {
  const z = document.createElement("div");
  z.id = "zoom"; z.hidden = true;
  z.setAttribute("role", "dialog"); z.setAttribute("aria-modal", "true");
  z.innerHTML = `<div class="z-card">
    <button class="z-x" aria-label="Cerrar">×</button>
    <img class="z-img" alt="">
    <div class="z-body">
      <div><span class="z-name"></span> <span class="tag cong z-tag"></span></div>
      <div class="price z-price"></div>
      <div class="z-row">
        <span class="stepper">
          <button class="z-minus" aria-label="Quitar una caja">−</button>
          <span class="qty z-qty" aria-live="polite">0</span>
          <button class="plus z-plus" aria-label="Agregar una caja">+</button>
        </span>
        <button class="send z-ok">Listo</button>
      </div>
    </div></div>`;
  document.body.appendChild(z);
  const paso = d => { CTL[z.dataset.cut](d); pintarZoom(); };
  z.querySelector(".z-minus").onclick = () => paso(-1);
  z.querySelector(".z-plus").onclick = () => paso(1);
  z.querySelector(".z-ok").onclick = cerrarZoom;
  z.querySelector(".z-x").onclick = cerrarZoom;
  z.onclick = e => { if (e.target === z) cerrarZoom(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !z.hidden) cerrarZoom(); });
})();

// Precios en vivo: hoja de Google "Lista de precios" publicada como CSV (si falla, quedan los de arriba)
const PRECIOS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrQV9ecnpvLHRYLqZVRuzZUeBV8bNwm6cxOLvWPN5RJfNiFPCWBIo1bMF_cv5803aQRHu5DVaJ2LiW/pub?gid=992929598&single=true&output=csv";
const clave = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\bcong\b/g, "").replace(/[^a-z0-9]/g, "");
const filaCSV = l => { const out = []; let cur = "", q = false;
  for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out; };
fetch(PRECIOS_CSV, {cache: "no-store"}).then(r => r.ok ? r.text() : Promise.reject()).then(txt => {
  const precios = {};
  txt.split(/\r?\n/).slice(1).forEach(l => {
    const [nombre, precio] = filaCSV(l);
    const n = parseInt(String(precio || "").replace(/[.,]\d{1,2}\s*$/, "").replace(/[^0-9]/g, ""), 10);
    if (nombre && n > 0) precios[clave(nombre)] = n;
  });
  PRODUCTS.forEach(p => {
    const n = precios[clave(p.name)];
    if (!n) return;
    p.price = n;
    const el = list.querySelector(`.price[data-cut="${CSS.escape(p.name)}"]`);
    if (el) el.innerHTML = `${money(n)}<small> x kg</small>`;
  });
}).catch(() => {});

function refresh(){
  const chosen = CUTS.filter(c => qty[c] > 0);
  const total = chosen.reduce((s,c) => s + qty[c], 0);
  document.getElementById("total").textContent = total === 1 ? "1 caja" : `${total} cajas`;
  document.getElementById("detail").textContent = chosen.length === 0
    ? "Todavía no elegiste nada"
    : chosen.length === 1 ? "1 corte" : `${chosen.length} cortes`;
  document.getElementById("copy").disabled = total === 0 || sending;
  const s2b = document.getElementById("send2"); if (s2b) s2b.disabled = total === 0 || sending;
}
const nameInput = document.getElementById("name");
nameInput.addEventListener("input", refresh);
let sending = false;
const WA = "5493518115125";
const bar = document.querySelector(".bar");
const sendBtn = document.getElementById("copy");
const fmt = iso => new Date(iso).toLocaleString("es-AR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const cajasTxt = n => n === 1 ? "1 caja" : n + " cajas";

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

// historial guardado en este celular
function leerHist(){ try{ return JSON.parse(localStorage.getItem("swiftPedidos") || "[]"); }catch(_){ return []; } }
function guardarHist(h){ try{ localStorage.setItem("swiftPedidos", JSON.stringify(h.slice(-50))); }catch(_){} }
try{ const n = localStorage.getItem("swiftNombre"); if (n) nameInput.value = n; }catch(_){}

function mensaje(name, items, total){
  return "*Pedido Swift*\nCliente: " + name + "\n" +
    items.map(i => `- ${i.cut}: ${cajasTxt(i.qty)}`).join("\n") +
    "\nTotal: " + cajasTxt(total);
}

function sendOrder(){
  const items = CUTS.filter(c => qty[c] > 0).map(c => ({cut:c, qty:qty[c]}));
  const name = nameInput.value.trim();
  if (!items.length) return;
  if (!name){ toast("Escribí tu nombre para enviar el pedido"); nameInput.focus(); return; }
  const total = items.reduce((s,i)=>s+i.qty,0);
  const url = "https://wa.me/" + WA + "?text=" + encodeURIComponent(mensaje(name, items, total));
  const w = window.open(url, "_blank", "noopener");
  if (!w){ const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
  try{ localStorage.setItem("swiftNombre", name); }catch(_){}
  const h = leerHist(); h.push({at:new Date().toISOString(), name, items, total}); guardarHist(h);
  CUTS.forEach(c => qty[c] = 0);
  document.querySelectorAll("#list li").forEach(li => {
    li.classList.remove("on"); li.querySelector(".qty").textContent = "0";
    li.querySelector(".minus").disabled = true;
  });
  ["list","note","send2"].forEach(id => document.getElementById(id).style.display = "none");
  document.querySelector(".field").style.display = "none";
  bar.style.display = "none";
  document.getElementById("sentText").textContent =
    `Se abrió WhatsApp con tu pedido de ${cajasTxt(total)}. Tocá enviar en WhatsApp para que le llegue al vendedor.`;
  document.getElementById("sent").style.display = "block";
  renderHistory(); refresh(); window.scrollTo({top:0});
}
sendBtn.onclick = sendOrder;
document.getElementById("send2").onclick = sendOrder;
document.querySelector("#sent h2").textContent = "Pedido listo para enviar";

document.getElementById("again").onclick = () => {
  document.getElementById("sent").style.display = "none";
  ["list","note","send2"].forEach(id => document.getElementById(id).style.display = "");
  document.querySelector(".field").style.display = "";
  bar.style.display = "";
  refresh();
};

function showTab(which){
  const hist = which === "hist";
  document.getElementById("catView").style.display = hist ? "none" : "";
  const hv = document.getElementById("histView"); hv.hidden = !hist; hv.style.display = hist ? "block" : "none";
  bar.style.display = hist ? "none" : (document.getElementById("sent").style.display === "block" ? "none" : "");
  document.getElementById("tabCat").setAttribute("aria-pressed", String(!hist));
  document.getElementById("tabHist").setAttribute("aria-pressed", String(hist));
}
document.getElementById("tabCat").onclick = () => showTab("cat");
document.getElementById("tabHist").onclick = () => showTab("hist");

function renderHistory(){
  const box = document.getElementById("hist");
  const orders = leerHist().sort((a,b) => b.at.localeCompare(a.at));
  document.getElementById("tabHist").textContent = orders.length ? `Mis pedidos (${orders.length})` : "Mis pedidos";
  if (!orders.length){ box.innerHTML = '<p class="empty">Todavía no hiciste ningún pedido desde este celular. Elegí tus cortes en el catálogo y tocá "Enviar pedido".</p>'; return; }
  box.innerHTML = "";
  orders.forEach(o => {
    const el = document.createElement("div");
    el.className = "order";
    el.innerHTML = `<div class="order-head"><span class="order-name"></span></div><p class="order-total"></p><ul></ul>`;
    el.querySelector(".order-name").textContent = fmt(o.at);
    el.querySelector(".order-total").textContent = cajasTxt(o.total);
    const ul = el.querySelector("ul");
    o.items.forEach(i => { const li = document.createElement("li"); li.textContent = `${i.cut}: ${cajasTxt(i.qty)}`; ul.appendChild(li); });
    const b = document.createElement("button");
    b.className = "done-btn"; b.textContent = "Repetir este pedido";
    b.onclick = () => {
      document.getElementById("again").click();
      document.querySelectorAll("#list li").forEach((li, idx) => {
        const cut = CUTS[idx], it = o.items.find(i => i.cut === cut), n = it ? it.qty : 0;
        qty[cut] = n; li.querySelector(".qty").textContent = n;
        li.querySelector(".minus").disabled = n === 0; li.classList.toggle("on", n > 0);
      });
      refresh(); showTab("cat"); window.scrollTo({top:0});
      toast("Pedido cargado. Revisalo y tocá Enviar pedido.");
    };
    el.appendChild(b);
    box.appendChild(el);
  });
}
renderHistory();
</script>
