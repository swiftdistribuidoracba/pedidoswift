<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swift Black · Carta de cortes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: carta de restaurante sobre cuero negro — logo y título, filtros por técnica, fichas de corte en grilla, barra fija de pedido */
:root{
  --leather:#131111; --card:#1D1A19; --card-2:#262221; --line:#3A3432;
  --silver:#D9D6D2; --muted:#9C948F; --red:#D2232A; --red-ink:#FFFFFF; --ember:#E9A15A;
  --f-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(5rem + env(safe-area-inset-top,0px))}
body{
  margin:0; color:var(--silver); font:400 16px/1.5 var(--f-body);
  background-color:var(--leather);
  background-image:radial-gradient(ellipse 90% 60% at 50% 0%, rgba(210,35,42,.13), transparent 70%),
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.025) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 80%, rgba(255,255,255,.02) 0 1px, transparent 1px);
  background-size:100% 100%, 5px 5px, 7px 7px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--leather)}
.wrap{max-width:68rem; margin:0 auto}

/* encabezado */
.hero{display:grid; grid-template-columns:auto 1fr; gap:1.25rem 1.5rem; align-items:center; padding-block:2rem 1.5rem}
.hero img{width:7.5rem; height:auto; border-radius:.5rem; box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06)}
.kicker{font:600 .82rem/1 var(--f-label); letter-spacing:.22em; text-transform:uppercase; color:var(--ember); margin:0 0 .5rem}
h1{font:600 clamp(2rem,7vw,3.6rem)/1 var(--f-display); letter-spacing:.06em; margin:0; color:#fff; text-wrap:balance}
.lede{margin:.7rem 0 0; color:var(--muted); max-width:34rem}
.stars{color:var(--red); letter-spacing:.4em; font-size:.7rem}

/* filtros */
.filters{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--leather); padding-block:.75rem; margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px))); padding-inline:max(16px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line)}
.filters-in{max-width:68rem; margin:0 auto; display:flex; gap:.5rem; overflow-x:auto; scrollbar-width:none}
.filters-in::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; font:600 .95rem/1 var(--f-label); letter-spacing:.06em; text-transform:uppercase; padding:.6rem .95rem; border-radius:2rem; border:1px solid var(--line); background:transparent; color:var(--silver); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--silver); color:var(--leather); border-color:var(--silver)}
.chip:focus-visible,.step button:focus-visible,.send:focus-visible,input:focus-visible{outline:2px solid var(--ember); outline-offset:2px}

/* fichas */
.count{font:500 .9rem var(--f-label); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:1.25rem 0 .75rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(17rem,1fr)); gap:1rem; padding-bottom:10rem}
.cut{background:var(--card); border:1px solid var(--line); border-radius:.9rem; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s}
.cut.on{border-color:var(--red)}
.photo{position:relative; aspect-ratio:4/3; max-width:100%; background:#fff}
.photo img{width:100%; height:100%; object-fit:cover; display:block}
.badges{position:absolute; left:.6rem; top:.6rem; display:flex; gap:.35rem}
.badge{font:700 .72rem/1 var(--f-label); letter-spacing:.1em; text-transform:uppercase; padding:.35rem .5rem; border-radius:.3rem; background:rgba(19,17,17,.82); color:#fff}
.badge.black{background:#0d0c0c; border:1px solid #6d6864}
.badge.frio{background:#173445; color:#BFE3F5}
.body{padding:1rem 1rem 1.1rem; display:flex; flex-direction:column; gap:.65rem; flex:1}
.cut h2{font:600 1.35rem/1.15 var(--f-display); letter-spacing:.04em; margin:0; color:#fff; text-wrap:balance}
.tech{display:flex; flex-wrap:wrap; gap:.35rem}
.tech span{font:600 .78rem/1 var(--f-label); letter-spacing:.08em; text-transform:uppercase; color:var(--ember); border:1px solid rgba(233,161,90,.35); border-radius:.3rem; padding:.3rem .45rem}
.dishes{margin:0; font-size:.95rem}
.dishes b{font:600 .78rem var(--f-label); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:.1rem}
.tip{margin:0; font-style:italic; color:var(--muted); font-size:.92rem; border-left:2px solid var(--red); padding-left:.65rem}
.order{margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding-top:.8rem; border-top:1px solid var(--line)}
.order .lbl{font:600 .85rem var(--f-label); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.step{display:flex; align-items:center; gap:.2rem}
.step button{width:2.4rem; height:2.4rem; border-radius:50%; border:1px solid var(--line); background:var(--card-2); color:var(--silver); font-size:1.25rem; line-height:1; cursor:pointer; padding:0}
.step button.plus{background:var(--red); border-color:var(--red); color:#fff}
.step button:disabled{opacity:.3; cursor:default}
.qty{width:2.1rem; text-align:center; font:700 1.2rem var(--f-label); font-variant-numeric:tabular-nums}
.empty{color:var(--muted); grid-column:1/-1}

/* barra de pedido */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:6; background:rgba(19,17,17,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding:.8rem max(16px, env(safe-area-inset-right,0px)) calc(.8rem + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.bar-in{max-width:68rem; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1rem}
.bar input{flex:1 1 12rem; min-width:0; padding:.75rem .9rem; border-radius:.6rem; border:1px solid var(--line); background:var(--card); color:var(--silver); font:inherit}
.bar input::placeholder{color:var(--muted)}
.tot{font:700 1.4rem/1 var(--f-label); color:#fff; white-space:nowrap}
.tot small{display:block; font:500 .8rem var(--f-body); color:var(--muted); margin-top:.2rem}
.send{border:0; border-radius:.6rem; padding:.85rem 1.3rem; background:var(--red); color:var(--red-ink); font:600 1rem var(--f-body); cursor:pointer; white-space:nowrap}
.send:disabled{opacity:.4; cursor:default}
.toast{position:fixed; left:50%; bottom:calc(8.5rem + env(safe-area-inset-bottom,0px)); transform:translate(-50%,.5rem); opacity:0; pointer-events:none; z-index:7;
  background:var(--silver); color:var(--leather); padding:.65rem 1rem; border-radius:.5rem; font-weight:600; max-width:90vw; text-align:center; transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (max-width:30rem){
  .hero{grid-template-columns:5.5rem 1fr; gap:1rem}
  .hero img{width:5.5rem}
  .lede{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.cut,.toast{transition:none}}
</style>
</head>

 {n:"Molleja", kg:10, t:["Parrilla","Plancha"], p:"Mollejas al limón, al verdeo, de entrada", tip:"Blanquear antes y terminar a fuego fuerte para que quede crocante.", frio:1},
 {n:"Nalga c/Tapa", t:["Milanesa","Horno","Plancha"], p:"Milanesa napolitana, carne al horno", tip:"Con su tapa protege la carne en el horno y suma sabor."},
 {n:"Nalga s/Tapa", t:["Milanesa","Plancha","Salteado"], p:"Milanesas, escalopes al limón, salteados", tip:"Limpia y tierna: el corte clásico para la milanesa de carta."},
 {n:"Peceto", t:["Horno","Braseado"], p:"Vitel toné, peceto al horno, roast beef", tip:"Forma cilíndrica pareja: fetas iguales para platos fríos."},
 {n:"Tapa de Asado", t:["Braseado","Horno","Parrilla"], p:"Tapa de asado al horno, carne a la cerveza, estofado", tip:"Rinde mejor en cocciones largas, al horno o en olla."},
 {n:"Tapa de Nalga", t:["Braseado","Horno","Parrilla"], p:"Carne rellena, arrollado, braseado al vino", tip:"Pieza plana ideal para rellenar y arrollar.", frio:1},
 {n:"Vacío", t:["Parrilla","Ahumado","Horno"], p:"Vacío a la parrilla, sándwich de vacío, vacío al horno", tip:"Fuego medio, primero del lado de la grasa."}
];
const TECNICAS = ["Todos","Parrilla","Horno","Plancha","Milanesa","Braseado","Ahumado","Salteado"];
const qty = Object.fromEntries(CORTES.map(c => [c.n,0]));
const cajas = n => n === 1 ? "1 caja" : n + " cajas";
const $ = id => document.getElementById(id);
let filtro = "Todos";
try{ const f = localStorage.getItem("cartaFiltro"); if (TECNICAS.includes(f)) filtro = f; }catch(_){}
try{ const n = localStorage.getItem("swiftNombre"); if (n) $("nombre").value = n; }catch(_){}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600); }

TECNICAS.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t; b.id = "f-" + t;
  b.onclick = () => { filtro = t; try{ localStorage.setItem("cartaFiltro", t); }catch(_){} pintarFiltro(); };
  $("filters").appendChild(b);
});

const cards = CORTES.map((c,i) => {
  const el = document.createElement("article");
  el.className = "cut";
  el.innerHTML = `
    <div class="photo"><img alt="" loading="lazy"><div class="badges"></div></div>
    <div class="body">
      <h2></h2>
      <div class="tech"></div>
      <p class="dishes"><b>En tu carta</b><span class="pl"></span></p>
      <p class="tip"></p>
      <div class="order"><span class="lbl">Caja x <span class="kg"></span> kg</span>
        <div class="step"><button class="minus" disabled>−</button><span class="qty" aria-live="polite">0</span><button class="plus">+</button></div>
      </div>
    </div>`;
  const img = el.querySelector("img"); img.src = PHOTOS[i]; img.alt = c.n;
  el.querySelector("h2").textContent = c.n;
  el.querySelector(".pl").textContent = c.p;
  el.querySelector(".tip").textContent = c.tip;
  el.querySelector(".kg").textContent = c.kg || 20;
  c.t.forEach(t => { const s=document.createElement("span"); s.textContent=t; el.querySelector(".tech").appendChild(s); });
  const bd = el.querySelector(".badges");
  const badge = (txt,cls) => { const s=document.createElement("span"); s.className="badge "+(cls||""); s.textContent=txt; bd.appendChild(s); };
  if (c.black) badge("Black","black");
  if (c.cerdo) badge("Cerdo");
  if (c.frio) badge("Congelado","frio");
  const [minus,plus] = el.querySelectorAll(".step button");
  minus.setAttribute("aria-label","Quitar una caja de "+c.n); plus.setAttribute("aria-label","Agregar una caja de "+c.n);
  const set = n => { qty[c.n]=Math.max(0,n); el.querySelector(".qty").textContent=qty[c.n]; minus.disabled=qty[c.n]===0; el.classList.toggle("on",qty[c.n]>0); total(); };
  minus.onclick = () => set(qty[c.n]-1); plus.onclick = () => set(qty[c.n]+1);
  $("grid").appendChild(el);
  return {c, el, set};
});

function pintarFiltro(){
  let n = 0;
  cards.forEach(({c,el}) => { const ok = filtro==="Todos" || c.t.includes(filtro); el.hidden = !ok; if (ok) n++; });
  TECNICAS.forEach(t => $("f-"+t).setAttribute("aria-pressed", String(t===filtro)));
  $("count").textContent = filtro==="Todos" ? `${n} cortes Swift` : `${n} cortes para ${filtro.toLowerCase()}`;
}

function total(){
  const sel = CORTES.filter(c => qty[c.n]>0);
  const t = sel.reduce((s,c)=>s+qty[c.n],0);
  $("tot").firstChild.textContent = cajas(t);
  $("det").textContent = !sel.length ? "Elegí tus cortes" : sel.length===1 ? "1 corte" : sel.length+" cortes";
  $("send").disabled = t===0;
}

$("send").onclick = () => {
  const items = CORTES.filter(c => qty[c.n]>0);
  const nombre = $("nombre").value.trim();
  if (!items.length) return;
  if (!nombre){ toast("Escribí el nombre de tu restaurante o comercio"); $("nombre").focus(); return; }
  try{ localStorage.setItem("swiftNombre", nombre); }catch(_){}
  const t = items.reduce((s,c)=>s+qty[c.n],0);
  const msg = "*Pedido Swift*\nCliente: " + nombre + "\n" + items.map(c => `- ${c.n}: ${cajas(qty[c.n])}`).join("\n") + "\nTotal: " + cajas(t) + "\n(Pedido desde la carta de cortes: espero precio y disponibilidad)";
  const a = document.createElement("a");
  a.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg); a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Se abrió WhatsApp con tu pedido. Tocá enviar para que nos llegue.");
};

pintarFiltro(); total();
</script>
</body>
</html>
